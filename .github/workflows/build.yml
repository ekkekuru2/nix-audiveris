name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Build audiveris
        run: nix build .#audiveris --print-build-logs

      # Runs the launcher itself, which is what catches environment problems
      # such as a JAVA_HOME preset by the host.
      - name: Run audiveris -version
        run: nix run . -- -version

      - name: Transcription smoke test
        run: nix build .#checks.x86_64-linux.transcribe --print-build-logs

      - name: Flake check
        run: nix flake check --print-build-logs
